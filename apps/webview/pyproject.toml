[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipi-chamber-webview"
version = "0.1.0"
description = "Read-only live web view for the IPI EUV experiment chamber"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "ipi-chamber-ctl",
  "ipi-ecs>=0.1.7",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
chamber-webview-api = "ipi_webview.api.main:main"
chamber-webview-batch-monitor = "ipi_webview.batch_monitor:main"
chamber-webview-dds-monitor = "ipi_webview.dds_monitor:main"

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
