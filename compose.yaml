name: ipi-live

services:
  edge:
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
      args:
        API_UPSTREAM: "${API_UPSTREAM:-host.docker.internal:8000}"
        VITE_GRAFANA_URL: "${GF_SERVER_ROOT_URL:-http://localhost:3000/}"
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      ipi-dashboard:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - web
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  ipi-dashboard:
    image: grafana/grafana:13.1.1
    restart: unless-stopped
    environment:
      GF_SERVER_DOMAIN: "${GF_SERVER_DOMAIN:-localhost}"
      GF_SERVER_ROOT_URL: "${GF_SERVER_ROOT_URL:-http://localhost:3000/}"
      GF_SERVER_PROTOCOL: "${GF_SERVER_PROTOCOL:-http}"
      GF_SECURITY_COOKIE_SECURE: "${GF_SECURITY_COOKIE_SECURE:-false}"
    volumes:
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_HOST_PORT:-3000}:3000"
    networks:
      - web
    security_opt:
      - no-new-privileges:true

  ipi-dashboard-db:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      PGUSER: "${PGUSER:-${POSTGRES_USER}}"
    volumes:
      - postgres-data:/var/lib/postgresql
    expose:
      - "5432"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - web
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  web:
    driver: bridge

volumes:
  grafana-data:
    external: true
    name: "${GRAFANA_DATA_VOLUME:-dashboard_ipi-dashboard-persist}"
  postgres-data:
    external: true
    name: "${POSTGRES_DATA_VOLUME:-dashboard_ipi-dashboard-db-persist}"